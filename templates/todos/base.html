<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TaskFlow{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #f6f5f2;
            --surface: #ffffff;
            --surface-2: #f0ede8;
            --border: #e5e1da;
            --text: #1a1916;
            --text-2: #6b6760;
            --text-3: #a8a49e;
            --accent: #d4622a;
            --accent-light: #fdf0ea;
            --accent-dark: #b84e1f;
            --low: #6b7280;
            --medium: #2563eb;
            --high: #d97706;
            --urgent: #dc2626;
            --success: #059669;
            --radius: 10px;
            --radius-sm: 6px;
            --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
            --shadow-md: 0 2px 8px rgba(0,0,0,.08), 0 8px 32px rgba(0,0,0,.06);
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            min-height: 100vh;
            font-size: 15px;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Navbar ── */
        .navbar {
            background: var(--surface) !important;
            border-bottom: 1px solid var(--border);
            padding: 0 0;
            height: 56px;
        }
        .navbar .container { height: 100%; }
        .navbar-brand {
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text) !important;
            letter-spacing: -.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand-dot {
            width: 8px; height: 8px;
            background: var(--accent);
            border-radius: 50%;
            display: inline-block;
        }
        .nav-link-item {
            font-size: .85rem;
            color: var(--text-2);
            text-decoration: none;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            transition: all .15s;
            font-weight: 500;
        }
        .nav-link-item:hover { color: var(--text); background: var(--surface-2); }
        .nav-link-item.active { color: var(--accent); background: var(--accent-light); }
        .nav-user {
            font-size: .82rem;
            color: var(--text-3);
            font-weight: 500;
            letter-spacing: .01em;
        }
        .btn-logout {
            font-size: .82rem;
            color: var(--text-2);
            background: none;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 4px 12px;
            cursor: pointer;
            transition: all .15s;
            font-family: inherit;
        }
        .btn-logout:hover { border-color: var(--text-2); color: var(--text); }

        /* ── Cards ── */
        .card {
            border: 1px solid var(--border) !important;
            border-radius: var(--radius) !important;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        /* ── Stat cards ── */
        .stat-card {
            border-radius: var(--radius) !important;
            padding: 18px 20px !important;
            cursor: default;
            transition: transform .2s, box-shadow .2s;
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .stat-num { font-size: 2rem; font-weight: 600; line-height: 1; letter-spacing: -.03em; }
        .stat-label { font-size: .75rem; color: var(--text-3); margin-top: 4px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }

        /* ── Task cards ── */
        .task-card {
            border-radius: var(--radius) !important;
            margin-bottom: 8px;
            transition: all .2s;
            border-left: 3px solid var(--border) !important;
            background: var(--surface);
        }
        .task-card:hover { box-shadow: var(--shadow-md); transform: translateX(1px); }
        .task-card.completed { opacity: .55; }
        .task-card.priority-low    { border-left-color: var(--low) !important; }
        .task-card.priority-medium { border-left-color: var(--medium) !important; }
        .task-card.priority-high   { border-left-color: var(--high) !important; }
        .task-card.priority-urgent { border-left-color: var(--urgent) !important; }

        /* ── Priority badges ── */
        .badge-priority {
            font-size: .68rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 100px;
            letter-spacing: .04em;
            text-transform: uppercase;
        }
        .badge-low    { background: #f1f2f4; color: var(--low); }
        .badge-medium { background: #eff6ff; color: var(--medium); }
        .badge-high   { background: #fffbeb; color: var(--high); }
        .badge-urgent { background: #fef2f2; color: var(--urgent); }

        /* ── Category pill ── */
        .cat-pill {
            font-size: .68rem;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 100px;
            letter-spacing: .03em;
        }

        /* ── Toggle circle ── */
        .toggle-btn {
            width: 24px; height: 24px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: none;
            cursor: pointer;
            transition: all .15s;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            text-decoration: none;
            color: var(--text-3);
        }
        .toggle-btn:hover { border-color: var(--success); color: var(--success); }
        .toggle-btn.done { background: var(--success); border-color: var(--success); color: white; }

        /* ── Action buttons ── */
        .btn-icon {
            width: 30px; height: 30px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: .75rem;
            color: var(--text-3);
            text-decoration: none;
            transition: all .15s;
        }
        .btn-icon:hover { border-color: var(--text-2); color: var(--text); }
        .btn-icon.danger:hover { border-color: var(--urgent); color: var(--urgent); background: #fef2f2; }

        /* ── Primary button ── */
        .btn-primary {
            background: var(--accent) !important;
            border-color: var(--accent) !important;
            color: white !important;
            font-weight: 500;
            font-size: .875rem;
            border-radius: var(--radius-sm) !important;
            padding: 8px 16px;
            transition: all .15s;
            font-family: inherit;
        }
        .btn-primary:hover { background: var(--accent-dark) !important; border-color: var(--accent-dark) !important; }
        .btn-outline-secondary {
            border-color: var(--border) !important;
            color: var(--text-2) !important;
            font-weight: 500;
            font-size: .875rem;
            border-radius: var(--radius-sm) !important;
            padding: 8px 16px;
            background: none !important;
            transition: all .15s;
            font-family: inherit;
        }
        .btn-outline-secondary:hover { border-color: var(--text-2) !important; color: var(--text) !important; }

        /* ── Form controls ── */
        .form-control, .form-select {
            border: 1px solid var(--border);
            border-radius: var(--radius-sm) !important;
            font-size: .875rem;
            font-family: inherit;
            color: var(--text);
            background: var(--surface);
            transition: border-color .15s, box-shadow .15s;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 3px rgba(212,98,42,.12) !important;
        }
        .form-label { font-size: .8rem; font-weight: 600; color: var(--text-2); letter-spacing: .03em; text-transform: uppercase; margin-bottom: 5px; }

        /* ── Overdue ── */
        .overdue-text { color: var(--urgent); font-weight: 500; }
        .completed-text { text-decoration: line-through; color: var(--text-3); }

        /* ── Subtask progress ── */
        .progress { height: 4px; border-radius: 100px; background: var(--surface-2); }
        .progress-bar { background: var(--success); border-radius: 100px; transition: width .3s; }

        /* ── Subtask list ── */
        .subtask-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            font-size: .82rem;
            color: var(--text-2);
            cursor: pointer;
            transition: color .15s;
        }
        .subtask-item:hover { color: var(--text); }
        .subtask-item.done { text-decoration: line-through; color: var(--text-3); }
        .subtask-check {
            width: 16px; height: 16px;
            border: 1.5px solid var(--border);
            border-radius: 3px;
            display: flex; align-items: center; justify-content: center;
            font-size: .6rem;
            color: transparent;
            transition: all .15s;
            flex-shrink: 0;
        }
        .subtask-item.done .subtask-check {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        /* ── Alerts ── */
        .alert {
            border-radius: var(--radius) !important;
            font-size: .875rem;
            border: 1px solid transparent;
        }
        .alert-success { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
        .alert-danger  { background: #fef2f2; color: #991b1b; border-color: #fecaca; }

        /* ── Due time ── */
        .due-time {
            font-family: 'DM Mono', monospace;
            font-size: .75rem;
        }

        /* ── Section divider ── */
        .section-label {
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--text-3);
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container d-flex align-items-center gap-3">
        <a class="navbar-brand" href="{% url 'task_list' %}">
            <span class="brand-dot"></span>TaskFlow
        </a>
        {% if user.is_authenticated %}
        <a href="{% url 'task_list' %}" class="nav-link-item {% if request.resolver_match.url_name == 'task_list' %}active{% endif %}">Tasks</a>
        <a href="{% url 'category_list' %}" class="nav-link-item {% if 'category' in request.resolver_match.url_name %}active{% endif %}">Categories</a>
        {% endif %}
        <div class="ms-auto d-flex align-items-center gap-3">
            {% if user.is_authenticated %}
            <span class="nav-user">{{ user.username }}</span>
            <a href="{% url 'logout' %}" class="btn-logout">Sign out</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container mt-4" style="max-width:860px">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show mb-3" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
