{% extends 'todos/base.html' %}
{% block title %}Delete Task — TaskFlow{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body text-center p-5">
                <div style="font-size:2.5rem;margin-bottom:1rem">🗑</div>
                <h5 style="font-weight:600;margin-bottom:.5rem">Delete task?</h5>
                <p style="color:var(--text-2);font-size:.9rem;margin-bottom:1.5rem">
                    "<strong>{{ task.title }}</strong>" will be permanently removed along with all its subtasks. This cannot be undone.
                </p>
                <form method="post" class="d-flex gap-2 justify-content-center">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-primary" style="background:var(--urgent)!important;border-color:var(--urgent)!important">
                        Delete
                    </button>
                    <a href="{% url 'task_list' %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
