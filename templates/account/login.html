{% extends 'base.html' %}
{% block title %}Sign In — TaskFlow{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div style="width:48px;height:48px;background:var(--accent-light);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px">
                        <i class="fas fa-check-circle fa-3x text-primary mb-2"></i>
                    </div>
                    <h5 style="font-weight:600;letter-spacing:-.01em">Welcome back</h5>
                    <p style="color:var(--text-3);font-size:.85rem;margin-bottom:0">Sign in to your TaskFlow account</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        <input type="{{ field.field.widget.input_type }}"
                               name="{{ field.html_name }}"
                               class="form-control"
                               {% if field.value %}value="{{ field.value }}"{% endif %}>
                        {% if field.errors %}
                        <div style="font-size:.8rem;color:var(--urgent);margin-top:4px">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100 mt-1">Sign In</button>
                </form>
                <div style="border-top:1px solid var(--border);margin:1.25rem 0"></div>
                <p class="text-center mb-0" style="font-size:.83rem;color:var(--text-3)">
                    No account? <a href="{% url 'register' %}" style="color:var(--accent)">Create one</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
