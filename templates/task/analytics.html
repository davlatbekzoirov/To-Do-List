{% extends 'base.html' %}
{% block title %}Analytics — TaskFlow{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 style="font-weight:600; margin-bottom:0;">Visual Analytics</h4>
    <a href="{% url 'task_list' %}" class="btn btn-outline-secondary btn-sm rounded-pill">
        <i class="fas fa-arrow-left me-1"></i> Back to Tasks
    </a>
</div>

<div class="row g-4">
    <div class="col-md-7">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body p-4">
                <h6 class="fw-bold mb-3 text-secondary">Tasks Completed (Last 7 Days)</h6>
                <div style="position: relative; height:300px; width:100%">
                    <canvas id="completionChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-5">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body p-4">
                <h6 class="fw-bold mb-3 text-secondary">Tasks by Category</h6>
                <div style="position: relative; height:300px; width:100%">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Completion Line Chart
    const ctxLine = document.getElementById('completionChart').getContext('2d');
    new Chart(ctxLine, {
        type: 'line',
        data: {
            labels: {{ completion_labels|safe }},
            datasets: [{
                label: 'Completed Tasks',
                data: {{ completion_counts|safe }},
                borderColor: '#6366f1',
                backgroundColor: 'rgba(99, 102, 241, 0.1)',
                fill: true,
                tension: 0.3,
                borderWidth: 3,
                pointBackgroundColor: '#6366f1'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, ticks: { stepSize: 1 } }
            }
        }
    });

    // Category Distribution Chart
    const ctxPie = document.getElementById('categoryChart').getContext('2d');
    new Chart(ctxPie, {
        type: 'doughnut',
        data: {
            labels: {{ cat_labels|safe }},
            datasets: [{
                data: {{ cat_counts|safe }},
                backgroundColor: {{ cat_colors|safe }},
                borderWidth: 2,
                borderColor: 'var(--surface)'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'bottom', labels: { boxWidth: 12, font: { family: 'DM Sans' } } }
            }
        }
    });
</script>
{% endblock %}
